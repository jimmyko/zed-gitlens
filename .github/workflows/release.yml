# Builds gitlens-ls for each platform and attaches it to the GitHub release.
# The extension downloads the asset named gitlens-ls-<target>.<tar.gz|zip>.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: server
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf gitlens-ls-${{ matrix.target }}.tar.gz -C server/target/${{ matrix.target }}/release gitlens-ls
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path server/target/${{ matrix.target }}/release/gitlens-ls.exe -DestinationPath gitlens-ls-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: gitlens-ls-${{ matrix.target }}.*
