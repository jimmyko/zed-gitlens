[package]
name = "gitlens-ls"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"
description = "Language server that adds GitLens-style git features to Zed"

# Standalone crate: it is built natively, while the extension at the repo root
# is built for wasm32-wasip2.
[workspace]

[dependencies]
anyhow = "1"
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
